<!DOCTYPE html>
<html>
<head>
    <title> Квадрат числа - AJAX </title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1> Обчислення квадрата числа </h1>
        <p> Введіть число, і сервер обчислить його квадрат через AJAX </p>
        
        <div class="input-group">
            <label for="numberInput"> Число: </label>
            <input type="number" id="numberInput" placeholder="Наприклад: 5">
            <button id="sendBtn"> Обчислити квадрат </button>
        </div>
        <div class="result" id="result"></div>
    </div>
    <script src="JS/script.js"> </script>
</body>
</html>
